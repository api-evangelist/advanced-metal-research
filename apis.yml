aid: advanced-metal-research
name: Advanced Metal Research
description: Advanced Metal Research is a Y Combinator (Spring 2026) company based in Los Angeles building
  machine intelligence for American welding. The company develops American-made robotic welding cells that
  pair computer vision with real-time seam tracking and post-weld inspection, turning welding from a scarce
  manual craft into a closed-loop manufacturing system that learns from every weld as it happens. Founded in
  2025 by Julian Fried, Stephen Lin, and Angus Muffatti, it targets the projected shortage of skilled welding
  professionals across US industrial manufacturing. The company is early-stage and hardware-focused; it does
  not currently publish a public developer API, SDKs, or API documentation.
